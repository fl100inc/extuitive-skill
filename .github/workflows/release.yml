# Attach the Claude Desktop skill bundle to a GitHub release.
#
# Claude Desktop's Chat and Cowork tabs take the skill as a `.zip` uploaded through
# Customize > Skills, and `npx extuitive install --host claude-desktop` exists only to build
# that file locally. Publishing the same file here gives people a download link instead,
# so that path needs no terminal at all. The asset name is fixed so the URL is too:
#
#   https://github.com/fl100inc/extuitive-skill/releases/latest/download/extuitive.zip
#
# Runs on every `v*` tag. `workflow_dispatch` takes a tag name so a release can be created
# for a tag that was pushed before this workflow existed; the workflow file itself runs from
# the default branch, and the checkout below is what pins the skill contents to the tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install: the installer is plain Node and builds the archive with
      # its own ZIP writer. Invoked directly rather than through `npm run bundle` because the
      # checkout is the tag, not the default branch, and a tag from before that script
      # existed has the CLI but not the script — which is exactly the backfill case.
      - name: Build the bundle
        run: node bin/cli.mjs install --host claude-desktop --dir dist --yes

      - name: Check the bundle
        run: |
          unzip -l dist/extuitive.zip
          unzip -l dist/extuitive.zip | grep -q ' extuitive/SKILL.md$'

      # The release page is what the README's "latest release" link lands on, so its notes
      # carry the whole Claude Desktop flow with a direct link to this release's own asset.
      # Kept in step with the README's Claude Desktop section by hand; there is nothing to
      # run, so there is nothing to generate it from.
      - name: Write the release notes
        env:
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/extuitive.zip
          README_URL: https://github.com/${{ github.repository }}#claude-desktop
        run: |
          cat > dist/notes.md <<EOF
          ## Install in Claude Desktop

          Download [\`extuitive.zip\`]($ASSET_URL). Then, in Claude Desktop:

          1. **Customize > Skills** — click **Add**, choose **Upload skill**, and upload that file.
          2. **Customize > Connectors** — click **Add**, and enter \`https://www.extuitive.com/mcp\` as the MCP server URL.
          3. Approve access in the browser window that opens, then start a new chat and say "Check my Extuitive connection".

          If Skills is not in the Customize menu, turn on code execution and file creation under Settings > Capabilities first.

          Claude Code and Codex use the installer instead: \`npx extuitive install\`. Details in the [README]($README_URL).
          EOF

      # `create` for a new tag; `upload --clobber` plus `edit --notes-file` when the release
      # is already there, which is what a re-run or a backfill of an existing release looks
      # like. `--generate-notes` appends the commit list under the notes above.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/extuitive.zip --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            gh release create "$TAG" dist/extuitive.zip --title "$TAG" --notes-file dist/notes.md --generate-notes
          fi
